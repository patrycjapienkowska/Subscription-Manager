services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    ports:
      - "14330:1433"   # dostęp z SSMS: localhost,14330 (login sa)
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      # Wewnątrz sieci Dockera baza jest pod nazwą "db" i portem 1433.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LifeAdminDb;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=True;"
    ports:
      - "8080:8080"

volumes:
  sqldata:
